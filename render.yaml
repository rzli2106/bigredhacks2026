services:
  - type: web
    name: clearpath
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://clearpath.wiki,https://www.clearpath.wiki,capacitor://localhost,https://localhost
      - key: PUBLIC_API_URL
        value: https://www.clearpath.wiki
      - key: PUBLIC_WS_URL
        value: wss://www.clearpath.wiki/ws/stream
      - key: PUBLIC_MOBILE_URL
        value: https://www.clearpath.wiki/mobile
