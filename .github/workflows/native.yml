name: Native mobility builds
on:
  push:
    branches: [main, codex/clearpath-deployment]
    paths: ['native/**', 'frontend/**', 'src/**', 'scripts/**', 'package*.json', 'capacitor.config.json', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_API_URL: https://clearpath.wiki
  PUBLIC_WS_URL: wss://clearpath.wiki/ws/stream
  PUBLIC_MOBILE_URL: https://clearpath.wiki/mobile
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run native:android && npm run native:configure
      - name: Build Android debug APK with the native bridge
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clearpath-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run native:ios
      - name: Compile iOS simulator app with HealthKit and Core Motion
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
